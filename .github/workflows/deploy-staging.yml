name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-landing-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested commit to Cloudflare preview
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PUBLIC_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Test staging identity guards
        run: node --test scripts/ops01/*.test.mjs

      - name: Verify Cloudflare staging project before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          STAGING_PAGES_PROJECT_ID: ${{ vars.STAGING_PAGES_PROJECT_ID }}
        run: node scripts/ops01/pages-staging.mjs preflight

      - name: Verify clean tested source before install and build
        env:
          PAGES_BUILD_PROVENANCE: ${{ runner.temp }}/landing-build-provenance.json
        run: node scripts/ops01/pages-staging.mjs source-before-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare existing Wrangler version outside application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/landing-wrangler" --no-save --package-lock=false wrangler@3.90.0
          ln -s "$RUNNER_TEMP/landing-wrangler/node_modules/wrangler" node_modules/wrangler
          ln -s "$RUNNER_TEMP/landing-wrangler/node_modules/.bin/wrangler" node_modules/.bin/wrangler
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "3.90.0"
          npx --no-install wrangler --version

      - name: Build landing site
        run: pnpm run build

      - name: Verify built release identity
        run: |
          body="$(cat dist/api/release)"
          jq -e --arg sha "$DEPLOY_SHA" \
            '.status == "ok" and .release == $sha' \
            <<<"$body" >/dev/null

      - name: Verify generated-only changes and hash build output
        env:
          PAGES_BUILD_PROVENANCE: ${{ runner.temp }}/landing-build-provenance.json
        run: node scripts/ops01/pages-staging.mjs source-after-build

      - name: Deploy stable staging preview
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "3.90.0"
          command: >-
            pages deploy dist
            --project-name=tenagain-landing
            --branch=staging
            --commit-hash=${{ env.DEPLOY_SHA }}

      - name: Verify exact provider deployment and save sanitized receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          STAGING_PAGES_PROJECT_ID: ${{ vars.STAGING_PAGES_PROJECT_ID }}
          PAGES_DEPLOYMENT_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          PAGES_BUILD_PROVENANCE: ${{ runner.temp }}/landing-build-provenance.json
        run: node scripts/ops01/pages-staging.mjs receipt

      - name: Retain sanitized provider receipt
        uses: actions/upload-artifact@v7
        with:
          name: landing-staging-provider-receipt
          path: pages-staging-receipt.json
          if-no-files-found: error
          retention-days: 14
